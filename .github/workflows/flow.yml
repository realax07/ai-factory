name: flow

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Validate specs (strict)
        run: openspec validate --all --strict

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Flow check
        run: python3 scripts/flow_check.py .

      - name: PR artifact validation (I3/I4)
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/pr_validate.py . \
            --id "$(cat "$GITHUB_EVENT_PATH" | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('pull_request',{}).get('title','')+' '+(d.get('pull_request',{}).get('body') or '')).strip())")" \
            || echo "::warning::pr_validate found missing artifacts (см. выше)" && exit 1
