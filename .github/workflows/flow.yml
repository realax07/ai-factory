name: flow

on:
  push:
    branches: [main, "pipeline/**"]
  pull_request:

jobs:
  # P0.5: полный набор тестов Flow Control (включая негативные сценарии
  # P0.2–P0.4) в обычном PR CI. Задача Заказчика — включить этот job в
  # required checks ruleset, тогда он станет обязательным для merge.
  test-flow-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (J64.17: по SHA)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (J64.17: по SHA)
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest==9.2.0  # J64.17: версия закреплена

      # GITHUB_EVENT_PATH удаляется на уровне процесса (env -u): Actions
      # всегда указывает эту переменную, а pr_validate/gate_runner трактуют
      # её наличие как «PR-контекст есть» — тогда негативные тесты
      # (SKIPPED без PR-контекста, tests/unit/test_gate_runner.py) получают
      # FAIL вместо SKIPPED. Локально переменной нет — тесты зеленые.
      # J52-w3 (gate self-test harness): прогон включает tests/
      # test_gate_harness.py — ворота конвейера обкатываются в CI-имитации
      # (shallow-клон эталонного репо, env -i: чистый HOME/PATH, без
      # openspec и GITHUB_*). Отдельный шаг «Gate harness» не нужен: он
      # гонял бы те же тесты в том же env (env -u GITHUB_EVENT_PATH) —
      # изоляции/ускорения не добавляет (review-005 minor #2). Покрыты
      # ancestry-ось класса BUG-022/023/024 (shallow/unshallow) и fresh-ось
      # (BUG-023/024: датированные эталонные коммиты; тесты
      # test_meta_commit_after_artifact_passes / _stale), класс J53 —
      # graceful-деградация без openspec (tests/unit/test_gate_harness.py).
      - name: Run tests
        run: env -u GITHUB_EVENT_PATH python -m pytest tests/ -q

      # pm_bounds_check (J9/J10) НЕ в CI: требует реестра сессий
      # (~/.hermes/state/active_sessions.json), которого на раннере нет —
      # консервативная ветка дает ложный FAIL. Гейт локальный (приемка).

  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (J64.17: по SHA)

      # J65.7: проект подключает ворота фабрики по закрепленной версии —
      # factory.lock в корне (repo=<owner/name>, sha=<40 hex>). CI делает
      # checkout фабрики на этот SHA в .factory/ и гоняет ЕЕ flow_check и
      # pr_validate против проекта; обновление ворот = PR с одной строкой sha.
      # Нет factory.lock (сама фабрика, проект до перевода) — свои scripts/.
      - name: Factory lock (J65.7)
        id: lock
        run: |
          if [ -f factory.lock ]; then
            SHA=$(sed -n 's/^sha=//p' factory.lock | tr -d '[:space:]')
            REPO=$(sed -n 's/^repo=//p' factory.lock | tr -d '[:space:]')
            if ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$' || [ -z "$REPO" ]; then
              echo "::error::factory.lock: нужны строки repo=<owner/name> и sha=<40 hex>"
              exit 1
            fi
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "repo=$REPO" >> "$GITHUB_OUTPUT"
            echo "FACTORY_SCRIPTS=.factory/scripts" >> "$GITHUB_ENV"
            echo "AI_FACTORY_HOME=$GITHUB_WORKSPACE/.factory" >> "$GITHUB_ENV"
          else
            echo "FACTORY_SCRIPTS=scripts" >> "$GITHUB_ENV"
          fi

      - name: Checkout factory at lock (J65.7)
        if: steps.lock.outputs.sha != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (J64.17: по SHA)
        with:
          repository: ${{ steps.lock.outputs.repo }}
          ref: ${{ steps.lock.outputs.sha }}
          path: .factory

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4 (J64.17: по SHA)
        with:
          node-version: 22

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.14.0

      - name: Validate specs (strict)
        run: openspec validate --all --strict

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (J64.17: по SHA)
        with:
          python-version: "3.12"

      - name: Flow check
        run: python3 "$FACTORY_SCRIPTS/flow_check.py" .

      - name: PR artifact validation (I3/I4, J6; code-review gate J10)
        if: github.event_name == 'pull_request'
        run: |
          PR_TEXT="$(cat "$GITHUB_EVENT_PATH" | python3 -c "import json,sys; d=json.load(sys.stdin); pr=d.get('pull_request',{}); print(pr.get('title','')+' '+(pr.get('body') or ''))")"
          # J10: PR по change-маркеру обязан иметь code-reviews/<change-id>/ с
          # approve-вердиктами задач из дифа — проверяет pr_validate.py (check_change).
          # Задачи берутся из ветки PR (GITHUB_HEAD_REF) и title/body.
          # Контекст диффа для [chore]/[docs]/[ops]-чекеров (env-конвенция
          # pr_validate): трогает ли PR активные спеки / код продукта.
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep '^openspec/changes/' | grep -vq '^openspec/changes/archive/'; then
            export PR_CHANGED_SPECS=1
          fi
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^(backend|frontend|services|src|e2e)/'; then
            export PR_CHANGED_CODE=1
          fi
          # J26: deploy-дифф (deploy/**, RUNBOOK.md) без [ops]-маркера в PR = FAIL.
          # Деплой-инфраструктура — зона devops-роли; ПМ/dev-PR с deploy-файлами
          # обязан идти как [ops] (девопс-делегация) — большинство наших ошибок
          # происходило на деплое (Р4/6.3 nginx-аватары, уроки прод-выкаток).
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^(deploy/|RUNBOOK\.md$)'; then
            export PR_CHANGED_DEPLOY=1
          fi
          # J50: UI-дельта (frontend/**, services/*/frontend/) и web-тесты
          # (tests/web/*.py) в дифе. Ворота «UI-дельта + макеты (design/**)
          # ⇒ web-тесты или [no-ui-tests] + основание» — check_ui_tests_gate
          # в pr_validate.py.
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^(frontend/|services/[^/]+/frontend/)'; then
            export PR_CHANGED_UI=1
          fi
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^tests/web/.*\.py$'; then
            export PR_CHANGED_WEBTESTS=1
          fi
          if ! python3 "$FACTORY_SCRIPTS/pr_validate.py" . --id "$PR_TEXT"; then
            echo "::error::pr_validate: обязательные артефакты отсутствуют (см. выше)"
            exit 1
          fi

      # J42 (L2): push сабагентской ветки pipeline/** без открытого PR —
      # падающий шаг (::error::) — детерминированный сигнал ПМ: сабагентская
      # ветка не прошла ворота — приемка через PR обязательна. Для push в
      # main и на PR шаг нейтрален (условие if).
      - name: Push gate — pipeline/** без открытого PR (J42)
        if: github.event_name == 'push' && startsWith(github.ref_name, 'pipeline/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.ref_name }}"
          OPEN_PRS=$(gh pr list --head "$BRANCH" --state open --json number --jq length)
          if [ "$OPEN_PRS" = "0" ]; then
            echo "::error::сабагентская ветка $BRANCH не прошла ворота — открой PR"
            exit 1
          fi

# Примечание (P0.5, обновлено волной 4 Н27): job test-flow-control (pytest tests/) НЕ
# зависит от job flow — pytest независим от flow_check. Историческая краснота flow_check
# на main (5 самоссылочных ошибок пакета add-deterministic-flow, гигиена P0.6) вычищена:
# main зелен. Красный job flow на PR — дефект ветки/этапности, не фон.
