name: flow

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # P0.5: полный набор тестов Flow Control (включая негативные сценарии
  # P0.2–P0.4) в обычном PR CI. Задача Заказчика — включить этот job в
  # required checks ruleset, тогда он станет обязательным для merge.
  test-flow-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest tests/ -q

  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Validate specs (strict)
        run: openspec validate --all --strict

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Flow check
        run: python3 scripts/flow_check.py .

      - name: PR artifact validation (I3/I4, J6; code-review gate J10)
        if: github.event_name == 'pull_request'
        run: |
          PR_TEXT="$(cat "$GITHUB_EVENT_PATH" | python3 -c "import json,sys; d=json.load(sys.stdin); pr=d.get('pull_request',{}); print(pr.get('title','')+' '+(pr.get('body') or ''))")"
          # J10: PR по change-маркеру обязан иметь code-reviews/<change-id>/ с
          # approve-вердиктами задач из дифа — проверяет pr_validate.py (check_change).
          # Задачи берутся из ветки PR (GITHUB_HEAD_REF) и title/body.
          if ! python3 scripts/pr_validate.py . --id "$PR_TEXT"; then
            echo "::error::pr_validate: обязательные артефакты отсутствуют (см. выше)"
            exit 1
          fi

# Примечание (P0.5): job test-flow-control (pytest tests/) НЕ зависит от job flow —
# pytest независим от flow_check. На момент этого изменения flow_check на main
# красный из-за 5 самоссылочных ошибок пакета add-deterministic-flow (гигиена P0.6,
# вне рамок P0.5), поэтому PR могут оставаться красными из-за соседнего job flow —
# это ожидаемо и не связано с тестами.
