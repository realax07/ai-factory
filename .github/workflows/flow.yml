name: flow

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Validate specs (strict)
        run: openspec validate --all --strict

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Flow check
        run: python3 scripts/flow_check.py .

      - name: PR artifact validation (I3/I4, J6)
        if: github.event_name == 'pull_request'
        run: |
          PR_TEXT="$(cat "$GITHUB_EVENT_PATH" | python3 -c "import json,sys; d=json.load(sys.stdin); pr=d.get('pull_request',{}); print(pr.get('title','')+' '+(pr.get('body') or ''))")"
          if ! python3 scripts/pr_validate.py . --id "$PR_TEXT"; then
            echo "::error::pr_validate: обязательные артефакты отсутствуют (см. выше)"
            exit 1
          fi
